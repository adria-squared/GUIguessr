<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="index.css">
		<link rel="icon" type="image/x-png" href="img/favicon.png">
	</head>
	<body id="body">
		<img src="title.png" class="center-img">
		<p></p>
		<img id="main_img" class="main_img" src="img/placeholder.png">
		<p></p>

		<table class="center" id="table_test">
			<tbody id="tab_main">
				<tr>
					<th>OS/GUI</th>
					<th>Version</th>
					<th>Company</th>
					<th>Release Date</th>
				</tr>
				<tr>
					<td id="cell_1">
						<div class="search-wrapper">
							<div class="search-input" id="search">
								<input type="text" placeholder="Type to guess" id="searchInput">
								<div id="suggestions">
								</div>
								<div class="search-icon"><i class="fas fa-search"></i></div>
							</div>
						</div>
						<text id="search_cell"></text>
					</td>
					<td id="version_cell">
						<div class="search-wrapper"  id="version_windows">
							<div class="search-input">
								<input type="text" placeholder="Type to guess" id="searchInput_win">
								<div id="suggestions_win"></div>
								<div class="search-icon"><i class="fas fa-search"></i></div>
							</div>
						</div>
						<div class="search-wrapper"  id="version_macos">
							<div class="search-input">
								<input type="text" placeholder="Type to guess" id="searchInput_mac">

						</div>
						<div class="search-wrapper"  id="version_deb">

								<div id="suggestions_deb">
								</div>
								<div class="search-icon"><i class="fas fa-search"></i></div>
							</div>
						</div>
						<text id="version"></text>
					</td>
					<td id="company"></td>
					<td id="date"></td>
				</tr>
			</tbody>
		</table>
		<div id="conglaturations" class="main_img">
			<text id="end_text" class="center_text">Conglaturations!!!<br>You found the secret message !!! (this means something went very wrong)</text>
			<br><br>
			<button type="button" class="end_button" onclick="reload()">retry</button>

	<script src="index.js"></script>
